<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Visualizer</title>
    <link rel="stylesheet" href="sort.css">
</head>
<body>
    <div class="controls">
        <button id="inputArray">Input Array</button>
        <select id="algorithm">
            <option value="bubble">Bubble Sort</option>
            <option value="selection">Selection Sort</option>
            <option value="quick">Quick Sort</option>   
            <option value="insertion">Insertion Sort</option>  
            <option value="heap">Heap Sort</option> 
            <option value="merge">Merge Sort</option> 

        </select>
        <button id="startSorting">Start Sorting</button>
        <button id="compareAll">Compare All</button>
    </div>
    <div id="arrayContainer" class="array-container"></div>
    <div id="statusMessage"></div>
    <div id="timeTakenContainer" class="time-taken-container">
       
        
        <div class="left"><span id="timeTaken">Time Taken: 0 ms</span><canvas id="comparisonChart"></canvas></div>
        <div class="right"><span id="swapCount">Swaps: 0</span><canvas id="barChartCanvas" ></canvas>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
